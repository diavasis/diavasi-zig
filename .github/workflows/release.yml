name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgrpc-dev
      - name: Check the tag and build
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/publish.sh
