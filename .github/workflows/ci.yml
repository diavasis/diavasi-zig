name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgrpc-dev
      - name: Require the C submodule
        run: test -f c/include/diavasi.h
      - run: zig build
